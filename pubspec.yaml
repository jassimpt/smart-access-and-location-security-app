publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.5.5
  local_auth: ^3.0.1
  cryptography: ^2.9.0
  geolocator: ^14.0.2
  geocoding: ^5.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
